<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>趙雲 — Voxel Musou</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<link rel="stylesheet" href="./src/ui/fonts/fonts.css">
<style>
  /* Biến font dùng chung — #hud (dưới đây) khai lại y hệt (không đổi hành vi cũ); #touch/#rotate-overlay (T8) dùng qua đây
     vì custom property chỉ lan xuống phần tử con, không lan sang phần tử anh em (#hud). */
  :root { --brush: "Xingkai SC", "STXingkai", "HudBrush", serif; --kai: "TKSerif", "Kaiti SC", "STKaiti", "KaiTi", "HudBrush", serif;
    --sans: "TKSans", "Avenir Next", "Helvetica Neue", sans-serif; --gold: #f2c14e; --teal: #3fb8b0; --seal: #b3261e; }
  html, body { margin: 0; height: 100%; background: #1a120d; overflow: hidden; overscroll-behavior: none; }
  canvas#c { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  /* T8.2: chặn cuộn/phóng to/kéo-để-tải-lại/bôi-đen-chữ/menu-nhấn-giữ trên toàn khung game — không đụng các bảng
     con (#lobby input, #menu .sound-row) là nơi vẫn cần cuộn/gõ chữ bình thường. */
  body.touch #c, body.touch #hud, body.touch #touch, body.touch #army-hud, body.touch #minimap { touch-action: none; }
  body.touch * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  body.touch input, body.touch textarea { -webkit-user-select: text; user-select: text; touch-action: manipulation; }

  /* ---- T8.5–T8.9: điều khiển cảm ứng (ui/touch.js). Chỉ hiện khi <body class="touch">. Vùng an toàn (tai thỏ,
     thanh điều hướng) trừ vào lề bằng env(safe-area-inset-*) — 0 trên máy không hỗ trợ. ---- */
  /* z-index 1 = cùng tầng #army-hud/#minimap/#pause-btn: khi tạm dừng, #menu (z-index 2) tự phủ lên trên, không cần
     JS ẩn/hiện #touch riêng lúc tạm dừng (main.js chỉ ẩn/hiện theo scene, giống #army-hud/#minimap). */
  #touch { display: none; position: fixed; inset: 0; z-index: 1; color: #f4ead8; font-family: var(--sans); }
  /* main.js ẩn/hiện #touch bằng thuộc tính `hidden` ở đúng những màn có tướng để điều khiển (giống #army-hud,
     #minimap) — :not([hidden]) để display:block không đè lên lúc đang hidden. */
  body.touch #touch:not([hidden]) { display: block; }
  #touch .tc-move, #touch .tc-cam, #touch .tc-attack, #touch .tc-ord, #touch .tc-heal { touch-action: none; }
  #touch .tc-move { position: absolute; left: max(2rem, env(safe-area-inset-left)); bottom: max(2rem, env(safe-area-inset-bottom));
    width: 11rem; height: 11rem; border-radius: 50%; background: rgba(20,14,10,.4); box-shadow: inset 0 0 0 .15rem rgba(244,234,216,.3); }
  #touch .tc-move.on { background: rgba(20,14,10,.6); }
  #touch .tc-move-stick { position: absolute; left: 50%; top: 50%; width: 4.6rem; height: 4.6rem; margin: -2.3rem;
    border-radius: 50%; background: rgba(242,193,78,.55); box-shadow: 0 0 0 .12rem rgba(244,234,216,.55); pointer-events: none; }
  #touch .tc-cam { position: absolute; right: 0; top: 7rem; bottom: 11rem; left: 40%; }   /* vuốt xoay camera — dưới các nút (stopPropagation); chừa dải trên cùng cho bảng mic #voice (cùng tầng z-index, đứng sau trong DOM nên che mất nút mic nếu phủ lên) */
  #touch .tc-attack { position: absolute; right: max(2.4rem, env(safe-area-inset-right)); bottom: max(2.2rem, env(safe-area-inset-bottom));
    width: 9.5rem; height: 9.5rem; border-radius: 50%; border: .15rem solid rgba(244,234,216,.5); background: rgba(179,38,30,.75);
    color: #f8e6d2; font: 700 1.7rem var(--kai); letter-spacing: .1em; }
  #touch .tc-attack.on { background: rgba(220,60,50,.9); transform: scale(0.94); }
  #touch .tc-orders { position: absolute; right: 11.4rem; bottom: 9.6rem; width: 13rem; height: 13rem; }
  #touch .tc-ord { position: absolute; width: 5rem; height: 5rem; border-radius: 50%; border: .12rem solid rgba(244,234,216,.4);
    background: rgba(20,14,10,.6); color: #f4ead8; font: 600 .95rem/1.1 var(--sans); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: .1rem; }
  #touch .tc-ord b { font: 700 1.1rem var(--kai); color: #f2c14e; }
  #touch .tc-ord.on { background: rgba(60,44,32,.85); }
  #touch .tc-ord.active { box-shadow: 0 0 0 .16rem #f2c14e; }
  #touch .tc-orders .tc-ord:nth-child(1) { right: 0; top: 4rem; }      /* 3 · Tấn công */
  #touch .tc-orders .tc-ord:nth-child(2) { right: 4rem; top: 0; }      /* 4 · Phòng thủ */
  #touch .tc-orders .tc-ord:nth-child(3) { right: 8rem; top: 4rem; }   /* 5 · Rút lui */
  #touch .tc-orders .tc-ord:nth-child(4) { right: 4rem; top: 8rem; }   /* 6 · Đi theo */
  #touch .tc-heal { position: absolute; right: max(2.4rem, env(safe-area-inset-right)); bottom: 12.4rem;
    width: 5.6rem; height: 5.6rem; border-radius: 50%; border: .12rem solid rgba(244,234,216,.4); background: rgba(63,184,176,.5);
    color: #f4ead8; font: 600 .85rem/1.15 var(--sans); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #touch .tc-heal b { font: 700 1.2rem var(--kai); color: #fff; }
  #touch .tc-heal.on { background: rgba(63,184,176,.8); }
  #touch .tc-heal.empty b { color: #c98; }

  /* ---- T8.3: chỉ chơi màn ngang. ---- */
  #rotate-overlay { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(10,7,6,.96); color: #f4ead8;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1rem; font-family: var(--sans); }
  #rotate-overlay .ic { font-size: 4rem; animation: rot-spin 1.6s ease-in-out infinite; }
  @keyframes rot-spin { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } }
  body.touch.portrait #rotate-overlay { display: flex; }

  /* ---- HUD (owned by the hud part). DW8 layout, concept calligraphy. 1rem = 1/72 viewport height (10 px @720p). ---- */
  html { font-size: calc(100vh / 72); }
  /* Portable brush fallback for machines without the macOS Xingkai/Kaiti assets: Yuji Boku (SIL OFL 1.1, Kinuta Font
     Factory), subset to the HUD's glyphs (src/ui/brush.woff2). Only fetched when the fonts before it are missing.
     When you add HUD text with new CJK characters, re-subset (Google Fonts css2?family=Yuji+Boku&text=...). */
  @font-face { font-family: "HudBrush"; src: url(./src/ui/brush.woff2) format("woff2"); font-display: swap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #f4ead8; user-select: none; overflow: hidden;
    --brush: "Xingkai SC", "STXingkai", "HudBrush", serif; --kai: "TKSerif", "Kaiti SC", "STKaiti", "KaiTi", "HudBrush", serif;
    --sans: "TKSans", "Avenir Next", "Helvetica Neue", sans-serif; --gold: #f2c14e; --teal: #3fb8b0; --seal: #b3261e;
    font-family: var(--kai); text-shadow: 0 .2rem .3rem rgba(0,0,0,.7); }
  #hud > * { position: absolute; }
  #hud .seal { display: inline-block; font: 700 1.3rem/1.05 var(--brush); font-style: normal; color: #f8e6d2; background: var(--seal);
    writing-mode: vertical-rl; padding: .3rem .22rem; border-radius: .25rem; text-shadow: none;
    box-shadow: inset 0 0 0 .14rem var(--seal), inset 0 0 0 .24rem rgba(248,230,210,.75), 0 .15rem .4rem rgba(0,0,0,.5); }
  #hud .bar { position: relative; background: rgba(10,7,6,.75); box-shadow: 0 0 0 .1rem rgba(0,0,0,.6), 0 .2rem .5rem rgba(0,0,0,.45); }
  #hud .bar i, #hud .bar em { position: absolute; inset: 0; transform-origin: 0 50%; }
  #hud .bar em { background: #f7efe2; }

  /* intro card: title + controls (concept top-left typography) */
  #hud .h-intro { left: 2.6rem; top: 1.4rem; }
  #hud .h-intro .zh { display: inline-block; font: 700 8rem/1 var(--brush); letter-spacing: .3rem; color: #f7f1e8;
    text-shadow: 0 0 .1rem #000, .3rem .4rem 0 rgba(0,0,0,.5), 0 0 2rem rgba(0,0,0,.4); }
  #hud .h-intro .seal { vertical-align: 1.2rem; margin-left: .6rem; }
  #hud .h-intro .en { font: 500 1.25rem/1 var(--sans); letter-spacing: .95em; margin: .2rem 0 0 .5rem; opacity: .85; }
  #hud .h-intro .sub { font-size: 1.45rem; letter-spacing: .35rem; margin: .9rem 0 0 .4rem; opacity: .85; }
  #hud .h-intro .keys { font: 500 1.15rem/2.2 var(--sans); margin: .9rem 0 0 .2rem; padding: .3rem 1rem; color: #efe3cf;
    background: linear-gradient(90deg, rgba(12,8,6,.62), rgba(12,8,6,0)); border-left: .2rem solid var(--seal); }
  #hud kbd { font: 600 1.05rem/1 var(--sans); padding: .2rem .45rem; border: .1rem solid rgba(239,227,207,.55); border-radius: .3rem;
    background: rgba(0,0,0,.4); margin-right: .15rem; }

  /* player: pixel portrait badge, brush name, long teal HP bar, 3-segment musou gauge (DW8 bottom band) */
  #hud .h-player { left: 0; right: 0; bottom: 0; height: 20rem; }
  #hud .badge { position: absolute; left: 3.4rem; bottom: 4.2rem; width: 11rem; height: 11rem; border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 50% 38%, #3c6f72, #16262a 70%); border: .35rem solid #d9d2c6;
    box-shadow: 0 0 0 .2rem #1a1210, 0 0 0 .38rem #b8893a, 0 .4rem 1rem rgba(0,0,0,.6); }
  #hud .badge canvas { position: absolute; left: 1.1rem; bottom: -.3rem; width: 8.8rem; height: 8.8rem; image-rendering: pixelated; }
  #hud .h-player.hurt .badge { border-color: #ff6a4a; }
  #hud .h-player.low .badge { box-shadow: 0 0 0 .2rem #1a1210, 0 0 0 .38rem #d23a24, 0 0 1.6rem rgba(230,60,30,.7); }
  #hud .name { position: absolute; left: 13.4rem; bottom: 7.9rem; font: 700 3.8rem/1 var(--brush); color: #f7f1e8;
    text-shadow: 0 0 .1rem #000, .2rem .3rem 0 rgba(0,0,0,.55); }
  #hud .hp { position: absolute; left: 16%; right: 22%; bottom: 6.8rem; height: 1.4rem;
    clip-path: polygon(0 0, 100% 0, calc(100% - 1rem) 100%, 0 100%); }
  #hud .hp { background: linear-gradient(rgba(58,46,38,.88), rgba(20,15,12,.88)); }   /* empty track: readable length */
  #hud .hp::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 .12rem rgba(214,184,130,.6); }
  #hud .hp em { opacity: .8; background: repeating-linear-gradient(90deg, rgba(0,0,0,.2) 0 .2rem, transparent .2rem .6rem),
    linear-gradient(#ffe6c0, #d8a060); }                                                  /* damage chunk (lags, then drains) */
  #hud .hp i { background: linear-gradient(#aef3e6 0 18%, #3fc2b4 30%, #1f8a82 85%, #146058); }
  #hud .h-player.low .hp i { background: linear-gradient(#ffb09a 0 18%, #e2402a 30%, #9a1c10 85%); }
  #hud .mu { position: absolute; left: 15%; width: 30%; bottom: 4.7rem; height: 1.3rem; display: flex; gap: .4rem; --p: 0; }
  #hud .mu div { position: relative; flex: 1; background: rgba(10,7,6,.75); box-shadow: 0 0 0 .1rem #6b4a1c, 0 0 0 .2rem rgba(0,0,0,.6);
    transform: skewX(-24deg); }
  #hud .mu i { position: absolute; inset: .15rem; transform-origin: 0 50%;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 .2rem, transparent .2rem .6rem), linear-gradient(#fff2b8, #f2c14e 45%, #b8791c); }
  #hud .mu span { position: absolute; left: calc(100% + 1.2rem); top: -1.1rem; white-space: nowrap; font: 700 2.4rem/1 var(--brush); color: #8a7658; }
  #hud .mu.full div { box-shadow: 0 0 0 .1rem #ffe8a0, 0 0 calc(.6rem + var(--p) * 1.4rem) rgba(255,200,80,.95); }
  #hud .mu.full i { background: linear-gradient(100deg, transparent calc(var(--s, -50%) - 18%), rgba(255,255,240,.9) var(--s, -50%), transparent calc(var(--s, -50%) + 18%)),
    repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 .2rem, transparent .2rem .6rem), linear-gradient(#fffbe0, #ffd45e 45%, #d08a1c); }
  #hud .mu.full span { color: #ffe3a0; text-shadow: 0 0 calc(.4rem + var(--p) * 1.2rem) #ffb030, .2rem .3rem 0 rgba(0,0,0,.6); }
  #hud .mu.active i { background: linear-gradient(#ffffff, #bfe8ff 45%, #4aa2ff); }
  #hud .mu.active span { color: #d8f2ff; text-shadow: 0 0 1rem #58b2ff; }

  /* Heavy numerals (KO, chain, milestone): DW8's weight in brush calligraphy. <b class="dig" data-t="N"><span>N</span></b>:
     ::before is a dark rim + halo (thick stroke, drop shadows) so digits read over white musou flashes and dark crowds;
     the span is a bevelled vertical gradient, fattened by an edge stroke in the mid tone. */
  #hud .dig { position: relative; isolation: isolate; padding: 0 .12em; --rw: .6rem; --ew: .16rem;
    --hi: #fffbe0; --mid: #ffd865; --lo: #b8680e; --rim: #2a1204; --edge: #f2b440; }
  #hud .dig::before { content: attr(data-t); position: absolute; left: 0; top: 0; padding: inherit; z-index: -1; text-shadow: none;
    color: var(--rim); -webkit-text-stroke: var(--rw) var(--rim); filter: drop-shadow(0 0 .7rem rgba(0,0,0,.65)) drop-shadow(.3rem .4rem 0 rgba(0,0,0,.5)); }
  #hud .dig span { text-shadow: none; color: transparent; -webkit-text-stroke: var(--ew) var(--edge);
    background: linear-gradient(var(--hi), var(--mid) 40%, color-mix(in srgb, var(--mid), var(--lo)) 62%, var(--lo));
    -webkit-background-clip: text; background-clip: text; }

  /* counters: KO bottom right (gold), chain left (ice cyan) — brush numerals, ghost layer <u> */
  #hud .num { position: relative; display: inline-block; }
  #hud .num b, #hud .num u { display: inline-block; font: 700 6.6rem/1 var(--brush); text-decoration: none; }
  #hud .num u { position: absolute; right: 0; top: 0; opacity: 0; }
  #hud .h-ko { right: 6.5%; bottom: 5.4rem; text-align: right; }
  #hud .h-ko b { transform-origin: 100% 85%; }
  #hud .h-ko u { color: #ffd66a; transform-origin: 100% 85%; padding: 0 .12em; text-shadow: 0 0 1.4rem rgba(255,190,60,.9); }
  #hud small { display: block; font: 700 1.15rem/1 var(--sans); letter-spacing: .3em; text-shadow: 0 0 .3rem #000, 0 .15rem .3rem rgba(0,0,0,.8); }
  #hud small em { font: 700 1.9rem/1 var(--brush); font-style: normal; letter-spacing: .1em; margin-right: .5rem; vertical-align: -.3rem; }
  #hud .h-ko small { color: #ffe0a0; margin-top: -.4rem; }
  #hud .h-chain { left: 11%; top: 45%; }
  #hud .h-chain b { transform-origin: 0 85%; --hi: #f4feff; --mid: #9aeaff; --lo: #1d78c0; --rim: #041a2e; --edge: #5cc8f4; }
  /* chain ghosts (pool of 3, one per tick): pale cyan digit with a DW8 motion smear trailing up-right, where it came from */
  #hud .h-chain u { transform-origin: 0 100%; color: #f4feff; -webkit-text-stroke: .22rem #3aa6f0; padding: 0 .12em;
    text-shadow: .12em -.1em 0 rgba(130,220,255,.55), .24em -.2em 0 rgba(110,205,255,.3), .36em -.3em .1rem rgba(90,190,255,.14),
      0 0 1.2rem rgba(90,200,255,.9); }
  #hud .h-chain small { color: #bfeeff; margin: -.3rem 0 0 .3rem; }

  /* KO milestone: centre, heavy gold brush number (digits ~13 % H like DW8) + red 擊破 seal stamp */
  #hud .h-mile { left: 0; right: 0; top: 33%; text-align: center; opacity: 0; }
  #hud .h-mile b { display: inline-block; font: 700 15rem/1 var(--brush); --rw: 1rem; --ew: .3rem; --hi: #fffdf0; --mid: #ffdc6a;
    vertical-align: middle; }
  #hud .h-mile b::before { filter: drop-shadow(0 0 1.4rem rgba(0,0,0,.8)) drop-shadow(.5rem .6rem 0 rgba(0,0,0,.5)); }
  #hud .h-mile .seal { font-size: 3.3rem; padding: .6rem .45rem; vertical-align: middle; margin-left: .2rem; }

  /* system banner: full-width band y 64-71 %; dialogue: portrait + 2 lines, lower left */
  #hud .h-band { left: 0; right: 0; top: 64%; padding: .6rem 0 .7rem; text-align: center; opacity: 0;
    background: linear-gradient(90deg, rgba(10,6,4,0), rgba(10,6,4,.72) 22%, rgba(10,6,4,.72) 78%, rgba(10,6,4,0));
    border-image: linear-gradient(90deg, transparent, rgba(214,170,90,.8) 30%, rgba(214,170,90,.8) 70%, transparent) 1; border-width: .1rem 0; border-style: solid; }
  #hud .h-band p { margin: 0; font: 700 2.6rem/1.15 var(--kai); letter-spacing: .4rem; }
  #hud .h-band p em { font-style: normal; color: #ff5b3c; }
  #hud .h-band small { margin-top: .35rem; opacity: .8; font-weight: 500; }
  #hud .h-dlg { left: 2.6rem; top: 9.6rem; display: flex; gap: 1.2rem; align-items: center; opacity: 0; padding: .6rem 6rem .6rem 1rem;
    background: linear-gradient(90deg, rgba(10,6,4,.8), rgba(10,6,4,.6) 65%, rgba(10,6,4,0)); border-left: .25rem solid var(--teal); }
  #hud .h-dlg canvas { width: 5.6rem; height: 5.6rem; image-rendering: pixelated; background: #1d3a3c; box-shadow: 0 0 0 .15rem #d9d2c6; }
  #hud .h-dlg b { font: 700 2rem/1 var(--brush); color: #9fe6de; }
  #hud .h-dlg b span { font: 600 .95rem/1 var(--sans); letter-spacing: .3em; color: #9fe6de; opacity: .8; margin-left: .5rem; }
  #hud .h-dlg p { margin: .4rem 0 .35rem; font: 700 2.3rem/1.1 var(--kai); letter-spacing: .12rem; white-space: nowrap; }
  #hud .h-dlg small { font-weight: 600; letter-spacing: .06em; font-size: 1.6rem; white-space: nowrap; color: #f4ead8; }

  /* musou: concept's vertical copy on the right */
  #hud .h-copy { right: 3.2%; top: 44%; writing-mode: vertical-rl; font: 700 3.4rem/1.3 var(--brush); letter-spacing: .5rem; opacity: 0;
    color: #f7f1e8; text-shadow: 0 0 .1rem #000, .2rem .3rem 0 rgba(0,0,0,.55), 0 0 1.4rem rgba(120,200,255,.5);
    border-top: .15rem solid rgba(247,241,232,.7); border-bottom: .15rem solid rgba(247,241,232,.7); padding: 1rem 0; }

  /* officer target bar (top left) + floating officer tags */
  #hud .h-target { left: 2.6rem; top: 2.2rem; width: 36%; opacity: 0; }
  #hud .h-target .seal { font-size: 1.6rem; vertical-align: .6rem; margin-right: .6rem; writing-mode: horizontal-tb; padding: .25rem .3rem; }
  #hud .h-target b { font: 700 2.8rem/1 var(--brush); color: #ffe3b0; }
  #hud .h-target span { font: 600 1rem/1 var(--sans); letter-spacing: .35em; margin-left: .8rem; opacity: .85; }
  #hud .h-target .bar { height: 1rem; margin-top: .5rem; clip-path: polygon(0 0, 100% 0, calc(100% - .7rem) 100%, 0 100%); }
  #hud .h-target .bar i { background: linear-gradient(#ffb49a 0 20%, #e0442e 35%, #8e1c10); }
  #hud .h-target .bar em { background: #ffcf8a; }
  #hud .h-target strong { position: absolute; left: 14rem; top: -.6rem; font: 700 4rem/1 var(--brush); color: #ff5b3c; opacity: 0;
    transform: rotate(-8deg); -webkit-text-stroke: .1rem #3a0a04; }
  #hud .h-target.ko strong { opacity: 1; }
  #hud .h-offs { inset: 0; }
  #hud .off { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; }
  /* anchor = the ▼▼ tip on the officer's head; .bd (name, romanisation, HP bar ~16 % W) is a 0×0 box at the anchor,
     moved/scaled from JS; .ld is the 1 px leader drawn when the body had to leave the ▼▼ */
  #hud .off .bd { position: absolute; left: 0; bottom: 0; width: 0; height: 0; }
  #hud .off b, #hud .off span, #hud .off .bar { position: absolute; left: -11rem; width: 22rem; text-align: center; }
  #hud .off b { bottom: 2.75rem; font: 700 2.5rem/1 var(--brush); color: #ffd9a8; }
  #hud .off span { bottom: 1.3rem; font: 700 1.3rem/1 var(--sans); letter-spacing: .24em; color: #f6e6d2; }
  #hud .off .bar { bottom: .2rem; left: -10.5rem; width: 21rem; height: .8rem; clip-path: polygon(0 0, 100% 0, calc(100% - .5rem) 100%, 0 100%); }
  #hud .off .bar i { background: linear-gradient(#ffb49a 0 20%, #e0442e 35%, #8e1c10); }
  #hud .off .mk { position: absolute; left: 0; bottom: 0; transform-origin: 50% 100%; font: 700 1.6rem/1 var(--sans); color: #ff4a2e;
    letter-spacing: -.2rem; white-space: nowrap; text-shadow: 0 0 .2rem #000, 0 .1rem .2rem rgba(0,0,0,.8); }
  #hud .off .ld { position: absolute; left: -.07rem; bottom: 0; width: .14rem; height: 1px; transform-origin: 50% 100%;
    background: rgba(255,217,168,.75); box-shadow: 0 0 .15rem rgba(0,0,0,.8); }

  #army-hud .ah-gold { display: flex; align-items: baseline; gap: .7rem; margin-bottom: .7rem; padding-bottom: .6rem; border-bottom: .08rem solid rgba(214,184,130,.3); }

  /* T2.7: bảng cửa hàng (phím B) — nổi trên HUD, KHÔNG dừng trận (khác #menu khi Esc). */
  #shop { position: fixed; left: 1.6rem; bottom: 1.6rem; z-index: 1; width: 30rem; max-height: 80vh; overflow-y: auto;

  #shop .shop-head { display: flex; justify-content: space-between; align-items: baseline; font: 700 1.7rem/1 "TKSerif", "Xingkai SC", "STXingkai", "HudBrush", serif; color: #f2c14e; margin-bottom: .3rem; }

  #shop .shop-row { display: flex; align-items: center; gap: .6rem; padding: .4rem .1rem; }
  #shop .shop-row span { flex: 1 1 auto; }
  #shop .shop-row .p { flex: 0 0 auto; opacity: .8; font-size: 1.05rem; }
  #shop .shop-row button { flex: 0 0 auto; padding: .4rem 1.1rem; cursor: pointer; border: 0; border-radius: .3rem;
    font: 700 1.15rem/1 "TKSans", "Avenir Next", "Helvetica Neue", sans-serif; color: #1a120d;
    background: linear-gradient(#ffe7a3, #f2c14e 55%, #c98a22); }
  #shop .shop-row.disabled button { cursor: not-allowed; background: #5a5248; color: #9a9284; }
  #shop .shop-row.disabled { opacity: .55; }
  #shop .shop-msg { min-height: 1.4rem; margin-top: .8rem; color: #ff8a70; font-size: 1.1rem; }
  #shop .hint { margin-top: .6rem; font: 500 1.1rem/1.4 "TKSans", "Avenir Next", "Helvetica Neue", sans-serif; opacity: .6; }
  /* T4.3/T4.4: chọn chế độ, phòng chờ, chọn phe & tướng — cùng bảng màu với #stub. */
  #lobby, #pick { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
    background: rgba(10,7,5,.9); color: #f4ead8; font-family: "TKSerif", "Kaiti SC", "STKaiti", "KaiTi", "HudBrush", serif; }
  #lobby[hidden], #pick[hidden] { display: none; }
  #lobby .card, #pick .card { min-width: 40rem; max-width: min(92vw, 62rem); padding: 3rem 3.6rem; text-align: center; border-radius: .6rem;
    background: linear-gradient(180deg, rgba(30,20,15,.92), rgba(14,10,8,.96)); box-shadow: 0 0 0 .15rem #5a3a10, 0 1rem 3rem rgba(0,0,0,.6); }
  #pick .card.wide { min-width: 62rem; max-width: 92vw; }
  #lobby .s-title, #pick .s-title { font: 700 3.2rem/1.2 "TKSerif", "Xingkai SC", "STXingkai", "HudBrush", serif; color: #f2c14e; letter-spacing: .2rem; }
  #lobby .s-sub, #pick .s-sub { margin: 1rem 0 0; font: 500 1.5rem/1.6 "TKSans", "Avenir Next", "Helvetica Neue", sans-serif; color: #cdbb9c; }
  #lobby .lb-body { margin-top: 1.6rem; font: 600 1.5rem/1.4 "TKSans", "Avenir Next", "Helvetica Neue", sans-serif; }
  #lobby .lb-group.stack { flex-direction: column; align-items: center; gap: .8rem; }
  #lobby .lb-group.stack > span { flex: none; text-align: center; }
  #lobby .lb-group.stack > div { justify-content: center; }
  #lobby .lb-row { display: flex; justify-content: space-between; align-items: center; gap: 1.4rem; margin: .8rem 0; }
  #lobby input { font: 600 1.6rem/1 "TKSans", "Avenir Next", "Helvetica Neue", sans-serif; padding: .7rem 1rem; width: 16rem; color: #f4ead8;
    background: rgba(0,0,0,.4); border: .1rem solid rgba(214,184,130,.5); border-radius: .3rem; text-align: center; letter-spacing: .15em; }
  #lobby .lb-group { display: flex; align-items: center; justify-content: space-between; gap: 1.6rem; margin: .9rem 0; text-align: left; }
  #lobby .lb-group > span { flex: 0 0 11rem; opacity: .8; }

  #lobby .chip { padding: .5rem 1.1rem; cursor: pointer; border-radius: .3rem; font: 600 1.3rem/1 "TKSans", "Avenir Next", "Helvetica Neue", sans-serif; color: #f4ead8;
    background: rgba(60,44,32,.9); border: .1rem solid rgba(214,184,130,.35); }
  #lobby .chip.on { color: #1a120d; background: linear-gradient(#ffe7a3, #f2c14e 55%, #c98a22); border-color: #5a3a10; }
  #lobby .lb-list { list-style: none; margin: 0; padding: 0; text-align: left; }

  #lobby .lb-list li.me { background: rgba(242,193,78,.08); }
  #lobby .lb-list em { font-style: normal; font-size: 1.15rem; opacity: .65; }
  #lobby .lb-list b { font-weight: 600; opacity: .6; } #lobby .lb-list b.ok { color: #7fe0c8; opacity: 1; }
  #lobby .lb-err { min-height: 1.6rem; margin-top: 1rem; color: #ff8a70; font: 500 1.3rem/1.4 "TKSans", "Avenir Next", "Helvetica Neue", sans-serif; }
  #lobby .lb-btns button, #pick .pk-fac, #pick .pk-gen { margin: 1rem .5rem 0; padding: 1rem 2.6rem; cursor: pointer; border: 0; border-radius: .4rem;
    font: 700 1.6rem/1 "TKSerif", "Xingkai SC", "STXingkai", "HudBrush", serif; letter-spacing: .15rem; color: #1a120d;
    background: linear-gradient(#ffe7a3, #f2c14e 55%, #c98a22); box-shadow: 0 0 0 .12rem #5a3a10; }
  #lobby .lb-btns button.secondary { color: #f4ead8; background: rgba(60,44,32,.9); box-shadow: 0 0 0 .1rem rgba(214,184,130,.4); }
  #lobby .lb-btns button:disabled { cursor: not-allowed; color: #9a9284; background: #4a443c; box-shadow: none; }
  #lobby .lb-btns button:not(:disabled):hover { filter: brightness(1.1); }
  #lobby .hint, #pick .hint { margin-top: 1.4rem; font: 500 1.2rem/1.5 "TKSans", "Avenir Next", "Helvetica Neue", sans-serif; opacity: .6; }

  #pick .pk-fac.taken { background: #4a443c; color: #b6ab9a; box-shadow: none; }
  #pick .pk-fac.taken.mine, #pick .pk-gen.mine { outline: .2rem solid #7fe0c8; }
  #pick .pk-fac:disabled { cursor: not-allowed; }
  #pick .f-flag { display: inline-flex; align-items: center; justify-content: center; width: 2.4rem; height: 2.4rem; border-radius: .25rem; color: #f8e6d2; font-size: 1.4rem; box-shadow: 0 0 0 1px rgba(255,255,255,.3); }
  #pick .pk-players { list-style: none; margin: 1.6rem 0 0; padding: 0; text-align: left; font: 600 1.4rem/1.3 "TKSans", "Avenir Next", "Helvetica Neue", sans-serif; }
  #pick .pk-players li { display: flex; gap: 1rem; padding: .6rem .9rem; border-top: .08rem solid rgba(214,184,130,.2); }

  #pick .pk-players i { font-style: normal; width: 2rem; opacity: .6; } #pick .pk-players span { flex: 1; } #pick .pk-players b { font-weight: 600; opacity: .85; }

</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<!-- T1.11: HUD quân riêng (army/units.js) — chỉ hiện khi có game.army (?mode=sandbox, T1.10). -->
<div id="army-hud" hidden></div>
<!-- T2.7: cửa hàng (phím B) — chỉ hiện khi có game.army (?mode=sandbox, T1.10). -->
<div id="shop" hidden></div>
<!-- T3.7: minimap trận (thay minimap Musou cũ khi ?mode=sandbox) -->
<canvas id="minimap" width="240" height="240" hidden></canvas>
<!-- Giai đoạn 8 (mục 16): điều khiển cảm ứng (src/ui/touch.js) — chỉ hiện khi <body class="touch"> (src/core/device.js). -->
<div id="touch" hidden></div>
<!-- T8.3: chỉ chơi màn ngang — CSS tự hiện khi body có cả class touch và portrait (main.js theo dõi orientation),
     không cần JS bật/tắt riêng nên không có thuộc tính hidden ở đây. -->
<div id="rotate-overlay">
  <div class="ic">⟳</div>
  <div data-i18n="touch.rotate"></div>
</div>
<!-- T3.6: màn kết quả trận đấu -->
<button id="pause-btn" type="button" hidden><span>⏸</span> <b data-i18n="hud.pause">Pause</b></button>
<!-- Giai đoạn 4 mở rộng: mic + âm lượng riêng từng người trong phòng (src/ui/voice.js) — hiện ở cả phòng chờ lẫn trong trận. -->
<div id="voice" hidden></div>
<div id="result" hidden></div>
<!-- T4.3/T4.4: chọn chế độ + phòng chờ, chọn phe & tướng (src/ui/lobby.js, src/ui/pick.js) -->
<div id="lobby" hidden></div>
<div id="pick" hidden></div>
<div id="menu">
  <div class="t">趙雲<i>常山</i></div>
  <div class="en">VOXEL MUSOU</div>
  <div class="sub" data-i18n="title.sub">一杆長槍，獨闖敵軍三百</div>

  <!-- Màn hình chính: Bắt đầu / Ngôn ngữ / Âm thanh / Hướng dẫn chơi (ui/menu.js). Khi tạm dừng giữa trận, "Bắt đầu" đổi thành "Tiếp tục". -->
  <nav class="menu-nav" id="menu-nav">
    <button id="go" type="button"><small data-i18n="title.start">START</small></button>
    <button id="nav-lang" class="secondary" type="button" data-i18n="menu.language">Language</button>
    <button id="nav-sound" class="secondary" type="button" data-i18n="menu.sound">Sound</button>
    <button id="nav-guide" class="secondary" type="button" data-i18n="menu.guide">How to play</button>
  </nav>

  <section class="menu-panel" id="panel-lang" hidden>
    <h2 data-i18n="menu.language">Language</h2>
    <div class="f-chips" id="langs"></div>
    <button type="button" class="panel-back secondary" data-i18n="common.back">Back</button>
  </section>

  <section class="menu-panel" id="panel-sound" hidden>
    <h2 data-i18n="sound.title">Sound</h2>
    <div class="sound-row">
      <span data-i18n="sound.volume">Volume</span>
      <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volume">
      <b id="volume-val">80</b>
    </div>
    <button id="mute" type="button" class="secondary small" data-i18n="sound.mute">Mute</button>
    <div class="hint" data-i18n="sound.hint"></div>
    <button type="button" class="panel-back secondary" data-i18n="common.back">Back</button>
  </section>

  <section class="menu-panel" id="panel-guide" hidden>
    <h2 data-i18n="guide.title">How to play</h2>
    <div class="guide-scroll">
      <h3 data-i18n="guide.controls">Controls</h3>
      <table>
        <tr><td>移動<small data-i18n="key.move">MOVE</small></td><td data-i18n-html="key.move.desc"></td></tr>
        <tr><td>攻擊<small data-i18n="key.attack">ATTACK</small></td><td data-i18n-html="key.attack.desc"></td></tr>
        <tr><td>蓄力<small data-i18n="key.charge">CHARGE</small></td><td data-i18n-html="key.charge.desc"></td></tr>
        <!-- Tạm tắt: bỏ comment khi Nhảy/Né đòn/Musou dùng lại được (xem src/core/input.js).
        <tr><td>跳躍<small>JUMP</small></td><td><kbd>Space</kbd></td></tr>
        <tr><td>閃避<small>DODGE</small></td><td><kbd>L</kbd> / <kbd>Shift</kbd></td></tr>
        <tr><td>無雙<small>MUSOU</small></td><td><kbd>I</kbd> — when the gold gauge is full</td></tr>
        -->
        <tr><td>視角<small data-i18n="key.camera">CAMERA</small></td><td data-i18n-html="key.camera.desc"></td></tr>
        <tr><td>藥<small data-i18n="key.heal">HEAL</small></td><td data-i18n-html="key.heal.desc"></td></tr>
        <tr><td>號令<small data-i18n="key.orders">ORDERS</small></td><td data-i18n-html="key.orders.desc"></td></tr>
        <tr><td>商店<small data-i18n="key.shop">SHOP</small></td><td data-i18n-html="key.shop.desc"></td></tr>
      </table>
      <h3 data-i18n="guide.generals">Generals</h3>
      <div class="hint" data-i18n="guide.generalsNote"></div>
      <div id="guide-generals"></div>
    </div>
    <button type="button" class="panel-back secondary" data-i18n="common.back">Back</button>
  </section>

  <!-- Chỉ hiện khi tạm dừng giữa trận (scene 'match'); main.js ẩn/hiện tùy chế độ. -->
  <button id="end-match-demo" class="end-demo" type="button" data-i18n="menu.endDemo" hidden>End match (demo)</button>
  <button id="leave-match" class="end-demo" type="button" data-i18n="menu.leave" hidden>Leave match</button>
  <div class="hint" id="menu-hint" data-i18n="title.hint">Enter to start · Esc to pause</div>
</div>

<!-- T0.4: màn hình dùng chung cho các scene chưa có UI riêng (chọn chế độ / phòng chờ / chọn phe & tướng / kết
     quả) — main.js đổi nội dung + hành vi nút theo scene hiện tại (src/core/scenes.js). -->
<div id="stub" hidden>
  <div class="card">
    <div class="s-title"></div>
    <div class="s-sub"></div>
    <button id="stub-go" type="button"></button>
    <div class="hint">Esc — quay lại màn hình chính</div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
